<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>explore - BookNest</title>
     <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/explore.css">
    <link rel="stylesheet" href="styles/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            <i class="fa-solid fa-book-open me-2"></i>BookNest
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="explore.html">Explore</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="account.html">Account</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="cart.html">Cart</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container explore-container">

    <div class="explore-heading text-center">
        <span>YOUR NEXT FAVORITE BOOK</span>
        <h1>Explore Our Collection</h1>
        <p>Find stories, ideas, and inspiration waiting for you.</p>
    </div>

    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput"
               placeholder="Search by book title or author...">
    </div>

    <div class="category-filters" id="categoryFilters">
      
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">Available Books</h5>
        <span id="booksCount" class="text-muted"></span>
    </div>

    <div class="row g-4" id="booksContainer"></div>

    <div id="emptyMessage" class="text-center py-5 d-none">
        <i class="fa-solid fa-book-open fa-3x mb-3 text-muted"></i>
        <h4>No books found</h4>
        <p class="text-muted">Try another search or category.</p>
    </div>

</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="mock-data/books.js"></script>
<script src="mock-data/categories.js"></script>
<script src="scripts/explore.js"></script>
</body>
</html>
