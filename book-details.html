
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details | BookNest</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles/book-details.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            <i class="fa-solid fa-book-open me-2"></i>BookNest
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="explore.html">Explore</a></li>
                <li class="nav-item"><a class="nav-link" href="signup.html">My Account</a></li>
                <li class="nav-item">
                    <a class="nav-link" href="cart.html">
                        <i class="fa-solid fa-cart-shopping"></i> Cart
                        <span id="cartCount" class="badge bg-warning text-dark">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">

    <div id="bookNotFound" class="alert alert-warning d-none">
        Book not found. <a href="explore.html">Explore our collection</a>
    </div>

    <div id="bookContent" class="row g-5">

        <div class="col-md-5">
            <div class="book-image-container">
                <img id="bookImage" src="" alt="Book cover" class="img-fluid">
            </div>
        </div>

        <div class="col-md-7">
            <span id="bookCategory" class="badge bg-secondary mb-3"></span>

            <h1 id="bookTitle" class="fw-bold"></h1>
            <p class="text-muted fs-5" id="bookAuthor"></p>

            <div class="rating-line mb-3">
                <span id="bookRating" class="fw-bold"></span>
                <span class="text-warning ms-2" id="bookStars"></span>
                <span class="text-muted ms-2" id="reviewCount"></span>
            </div>

            <p id="bookSummary" class="text-secondary lh-lg"></p>

            <hr>

            <h5 class="fw-bold mb-3">Choose your format</h5>

            <div id="formatOptions" class="d-flex flex-wrap gap-3 mb-4"></div>

            <div class="mb-4">
                <span class="text-muted">Price:</span>
                <h3 id="bookPrice" class="fw-bold text-success"></h3>
            </div>

            <button id="addToCartBtn" class="btn btn-dark btn-lg px-4">
                <i class="fa-solid fa-cart-shopping me-2"></i>
                Add to Cart
            </button>

            <div id="cartMessage" class="alert alert-success mt-3 d-none">
                Book added to your cart!
                <a href="cart.html">View Cart</a>
            </div>
        </div>
    </div>

    <hr class="my-5">

    <section id="reviewsSection">
        <h3 class="fw-bold mb-4">Customer Reviews</h3>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="rating-summary p-4 rounded">
                    <h1 id="summaryRating" class="fw-bold"></h1>
                    <div id="summaryStars" class="text-warning fs-5"></div>
                    <p class="text-muted mt-2 mb-0" id="summaryCount"></p>
                    <hr>
                    <div id="ratingBars"></div>
                </div>
            </div>

            <div class="col-md-8">
                <div id="reviewsList"></div>
            </div>
        </div>
    </section>

</main>

<footer class="bg-dark text-white text-center py-4">
    <p class="mb-0">© 2026 BookNest. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="mock-data/books.js"></script>
<script src="mock-data/categories.js"></script>
<script src="scripts/book-details.js"></script>

</body>
</html>
