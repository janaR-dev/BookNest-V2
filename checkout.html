
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | BookNest</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles/checkout.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            <i class="fa-solid fa-book-open me-2"></i>BookNest
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="explore.html">Explore</a></li>
                <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
                <li class="nav-item"><a class="nav-link active" href="checkout.html">Checkout</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">

    <h2 class="fw-bold mb-2">Checkout</h2>
    <p class="text-muted mb-4">Complete your order details below.</p>

    <div id="emptyCart" class="alert alert-warning d-none">
        Your cart is empty. <a href="explore.html">Explore books</a>
    </div>

    <form id="checkoutForm" class="row g-4">

        <div class="col-lg-7">

            <div class="checkout-card p-4 mb-4">
                <h5 class="fw-bold mb-3">
                    <i class="fa-solid fa-user me-2"></i>Customer Information
                </h5>

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="customerName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="customerEmail" class="form-control" required>
                </div>
            </div>

            <div id="shippingSection" class="checkout-card p-4 mb-4">
                <h5 class="fw-bold mb-3">
                    <i class="fa-solid fa-truck me-2"></i>Shipping Details
                </h5>

                <div class="mb-3">
                    <label class="form-label">Full Address</label>
                    <textarea id="shippingAddress" class="form-control" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">City</label>
                    <input type="text" id="shippingCity" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" id="shippingPhone" class="form-control">
                </div>
            </div>

            <div class="checkout-card p-4">
                <h5 class="fw-bold mb-3">
                    <i class="fa-solid fa-credit-card me-2"></i>Payment Method
                </h5>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="radio"
                        name="paymentMethod" id="cashPayment"
                        value="Cash on Delivery" checked>
                    <label class="form-check-label" for="cashPayment">
                        Cash on Delivery
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio"
                        name="paymentMethod" id="cardPayment"
                        value="Card">
                    <label class="form-check-label" for="cardPayment">
                        Credit / Debit Card
                    </label>
                </div>

                <div id="cardDetails" class="mt-3 d-none">
                    

                    <div class="mb-3">
                        <label class="form-label">Cardholder Name</label>
                        <input type="text" id="cardName" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Card Number</label>
                        <input type="text" id="cardNumber"
                            class="form-control" maxlength="19"
                            placeholder="1234 5678 9012 3456">
                    </div>

                    <div class="row">
                        <div class="col-6">
                            <label class="form-label">Expiry Date</label>
                            <input type="text" id="cardExpiry"
                                class="form-control" placeholder="MM/YY">
                        </div>
                        <div class="col-6">
                            <label class="form-label">CVV</label>
                            <input type="password" id="cardCvv"
                                class="form-control" maxlength="4">
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="col-lg-5">
            <div class="checkout-card p-4">
                <h5 class="fw-bold mb-3">Order Summary</h5>

                <div id="checkoutItems"></div>

                <hr>

                <div class="d-flex justify-content-between mb-2">
                    <span>Subtotal</span>
                    <strong id="subtotal">0.00</strong>
                </div>

                <div class="d-flex justify-content-between mb-2">
                    <span>Shipping</span>
                    <strong id="shippingCost">0.00</strong>
                </div>

                <hr>

                <div class="d-flex justify-content-between fs-5">
                    <strong>Total</strong>
                    <strong id="totalPrice">0.00</strong>
                </div>

                <button type="submit" id="placeOrderBtn"
                    class="btn btn-dark w-100 mt-4">
                    <i class="fa-solid fa-check me-2"></i>
                    Place Order
                </button>
            </div>
        </div>

    </form>
    
    <footer class="bg-dark text-white text-center py-4">
    <p class="mb-0">© 2026 BookNest. All rights reserved.</p>
</footer>
</main>

<script src="mock-data/books.js"></script>
<script src="scripts/checkout.js"></script>

</body>
</html>
